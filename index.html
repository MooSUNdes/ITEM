<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實驗室器材雲端管理系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sky: #A8D8EA;
            --bg-cloud: #E0F7FA;
            --paper-color: #FDFBF7;
            --forest-green: #5F7161;
            --earth-brown: #6D4C41;
            --accent-red: #D88585;
            --grass-green: #9EBA8A;
            --ink-color: #4A4A4A;
            --tag-bg: #EFEAD8;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            padding: 40px 20px;
            background-image: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-cloud) 100%);
            color: var(--ink-color);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--paper-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 2px solid #EFEAD8;
            position: relative;
        }

        h1 {
            color: var(--forest-green);
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--grass-green);
            padding-bottom: 15px;
        }

        /* 讀取中的遮罩 */
        #loadingOverlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            color: var(--forest-green);
            border-radius: 20px;
            z-index: 99;
            backdrop-filter: blur(2px);
        }

        .input-group {
            background-color: #F4F1EA;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border: 1px solid #E0DVC5;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            padding: 10px 15px;
            border: 2px solid #DCD7C9;
            border-radius: 10px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            flex: 1;
            outline: none;
            color: var(--earth-brown);
            min-width: 150px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; opacity: 0.7; }

        .btn-add { background-color: var(--forest-green); color: #fff; }
        .btn-add:hover:not(:disabled) { background-color: #4A5D4B; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 15px; }
        
        thead th {
            text-align: left;
            padding: 10px 15px;
            color: var(--earth-brown);
            border-bottom: 2px solid var(--grass-green);
        }

        tbody tr { background-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        tbody td {
            padding: 20px 15px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        tbody tr td:first-child {
            border-left: 1px solid #eee;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            font-weight: bold;
            color: var(--forest-green);
            font-size: 1.1em;
        }

        tbody tr td:last-child {
            border-right: 1px solid #eee;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .stock-display { font-size: 1.2em; font-weight: bold; }
        .stock-low { color: var(--accent-red); }
        .stock-normal { color: var(--forest-green); }

        .borrower-list { list-style: none; padding: 0; margin: 0; }

        .borrower-item {
            background-color: var(--tag-bg);
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            border-left: 4px solid var(--earth-brown);
        }

        .borrower-info { display: flex; flex-direction: column; }
        .borrower-header { font-weight: bold; color: var(--earth-brown); }
        .borrower-count { color: var(--accent-red); font-weight: bold; margin-left: 5px; }
        .borrower-time { font-size: 0.8em; color: #888; margin-top: 2px;}

        .btn-borrow { background-color: var(--grass-green); color: white; width: 100%; }
        .btn-borrow:hover:not(:disabled) { background-color: #8CA57A; }
        
        .btn-return { 
            background-color: #FBC02D; 
            color: #5d4037; 
            font-size: 0.8em; 
            padding: 5px 10px;
            margin-left: 10px;
            white-space: nowrap;
        }
        
        .btn-del-main { 
            background-color: #eee; 
            color: #888; 
            margin-top: 10px; 
            font-size: 0.8em;
            width: 100%;
        }
        .btn-del-main:hover { background-color: var(--accent-red); color: white; }

        .decoration { position: absolute; font-size: 3rem; opacity: 0.2; pointer-events: none; }
        .cloud-1 { top: -20px; left: -20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="decoration cloud-1">☁️</div>

    <h1>🌿 實驗室器材雲端管理</h1>
    
    <div id="loadingOverlay">
        <span>資料同步中... 🌱</span>
    </div>

    <form id="addForm" class="input-group">
        <input type="text" id="eqName" placeholder="器材名稱 (例如：燒杯)" required>
        <input type="number" id="eqTotal" placeholder="總數量 (個)" min="1" required style="flex: 0 0 120px;">
        <button type="submit" class="btn-add">＋ 入庫登記</button>
    </form>

    <table>
        <thead>
            <tr>
                <th width="20%">器材名稱</th>
                <th width="15%">剩餘 / 總量</th>
                <th width="45%">借用紀錄 (子項目)</th>
                <th width="20%">操作</th>
            </tr>
        </thead>
        <tbody id="listBody"></tbody>
    </table>
</div>

<script>
    // 🔴 請把下方這串網址換成您部署後的 Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwxM76KUmVRVpfgor54AL14qhB8zqZZCQA78pbyNW9bCyPPwr-vfl5_ZlQy4zSfgLuVgg/exec/exec";

    let inventory = [];
    const listBody = document.getElementById('listBody');
    const loadingOverlay = document.getElementById('loadingOverlay');

    function getCurrentTime() {
        const now = new Date();
        return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function showLoading(show) {
        loadingOverlay.style.display = show ? 'flex' : 'none';
    }

    // 1. 讀取資料 (GET)
    function fetchInventory() {
        showLoading(true);
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                inventory = data;
                render();
                showLoading(false);
            })
            .catch(err => {
                console.error(err);
                alert("無法連線到資料庫，請檢查網路或 URL");
                showLoading(false);
            });
    }

    // 2. 傳送資料 (POST)
    function syncData(action, payload) {
        showLoading(true);
        // 使用 text/plain 避免 CORS 預檢請求 (Google Apps Script 特性)
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: action, ...payload }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(res => res.json())
        .then(response => {
            if(response.status === 'success') {
                fetchInventory(); // 成功後重新抓取最新資料
            } else {
                alert("同步失敗：" + response.message);
                showLoading(false);
            }
        })
        .catch(err => {
            alert("同步發生錯誤");
            showLoading(false);
        });
    }

    function render() {
        listBody.innerHTML = "";
        inventory.forEach((item) => {
            const tr = document.createElement('tr');
            
            const borrowedTotal = item.borrowers.reduce((sum, record) => sum + record.count, 0);
            const available = item.total - borrowedTotal;
            const stockClass = available === 0 ? 'stock-low' : 'stock-normal';
            
            let borrowersHtml = "";
            if (item.borrowers.length > 0) {
                borrowersHtml = `<ul class="borrower-list">`;
                item.borrowers.forEach((b, index) => {
                    borrowersHtml += `
                        <li class="borrower-item">
                            <div class="borrower-info">
                                <div>
                                    <span class="borrower-header">👤 ${b.name}</span>
                                    <span class="borrower-count">× ${b.count} 個</span>
                                </div>
                                <span class="borrower-time">🕒 ${b.time}</span>
                            </div>
                            <button class="btn-return" onclick="returnItem(${item.id}, ${index})">歸還</button>
                        </li>`;
                });
                borrowersHtml += `</ul>`;
            } else {
                borrowersHtml = `<span style="color:#aaa; font-style:italic;">目前在庫，無人借用</span>`;
            }

            const disableBorrow = available <= 0;
            const borrowBtnText = disableBorrow ? "庫存不足" : "借用器材";

            tr.innerHTML = `
                <td>${item.name}</td>
                <td>
                    <span class="stock-display ${stockClass}">${available}</span> 
                    <span style="color:#888;">/ ${item.total} 個</span>
                </td>
                <td>${borrowersHtml}</td>
                <td>
                    <button class="btn-borrow" onclick="borrowItem(${item.id})" ${disableBorrow ? 'disabled' : ''}>${borrowBtnText}</button>
                    <button class="btn-del-main" onclick="deleteMainItem(${item.id})">刪除品項</button>
                </td>
            `;
            listBody.appendChild(tr);
        });
    }

    // --- 操作邏輯 ---

    // 新增
    document.getElementById('addForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newItem = {
            id: Date.now(),
            name: document.getElementById('eqName').value,
            total: parseInt(document.getElementById('eqTotal').value)
        };
        // 送出新增請求
        syncData('add', newItem);
        document.getElementById('addForm').reset();
    });

    // 借用
    window.borrowItem = function(id) {
        const item = inventory.find(i => i.id === id);
        const currentBorrowed = item.borrowers.reduce((sum, b) => sum + b.count, 0);
        const available = item.total - currentBorrowed;

        if (available <= 0) { alert("庫存不足！"); return; }

        let countInput = prompt(`「${item.name}」剩餘 ${available} 個，借出幾個？`, "1");
        if (countInput === null) return;
        let count = parseInt(countInput);
        if (isNaN(count) || count <= 0 || count > available) { alert("數量無效"); return; }

        const name = prompt(`借出 ${count} 個給誰？`);
        if (name && name.trim() !== "") {
            // 更新本地資料結構，準備上傳
            item.borrowers.push({ name: name, count: count, time: getCurrentTime() });
            syncData('update', { id: item.id, borrowers: item.borrowers });
        }
    };

    // 歸還
    window.returnItem = function(itemId, index) {
        const item = inventory.find(i => i.id === itemId);
        const b = item.borrowers[index];
        if (confirm(`確認「${b.name}」歸還器材嗎？`)) {
            item.borrowers.splice(index, 1);
            syncData('update', { id: item.id, borrowers: item.borrowers });
        }
    };

    // 刪除
    window.deleteMainItem = function(id) {
        if(confirm("確定要刪除此器材品項嗎？(無法復原)")) {
            syncData('delete', { id: id });
        }
    };

    // 初始化讀取
    fetchInventory();

</script>
</body>
</html>
